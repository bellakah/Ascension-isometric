name: Ascension Identity Apply

on:
  push:
    branches:
      - feat/ascension-identity-base

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped public identity migration
        run: node scripts/ascension_identity_apply.mjs
      - name: Commit generated identity changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No identity changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html editor.html public/manifest.webmanifest src/ui/i18n.catalog/editor.ts src/ui/i18n.catalog/shell.ts src/ui/i18n.locales
          git commit -m 'feat(identity): establish Ascension public branding'
          git push origin HEAD:feat/ascension-identity-base
